version: '3.8'

services:
  # 1. Frontend Web App (React 19 + TypeScript + Nginx)
  frontend:
    build:
      context: ./task-management
      dockerfile: Dockerfile
    container_name: task-management-ui
    ports:
      - '3000:80'
    environment:
      - VITE_USE_MOCK_API=true
      - VITE_API_BASE_URL=http://localhost:8080
    depends_on:
      - backend
    restart: unless-stopped

  # 2. Backend API Service (Express.js + Node.js)
  backend:
    build:
      context: ./task-managemnet-BE
      dockerfile: Dockerfile
    container_name: task-management-api
    ports:
      - '8080:8080'
    environment:
      - SERVER_PORT=8080
      - MONGO_URL=mongodb://mongo:27017/taskmanager
      - JWT_SECRET=taskpulse_production_secret_key_2026
    depends_on:
      - mongo
    restart: unless-stopped

  # 3. Database (MongoDB)
  mongo:
    image: mongo:7.0
    container_name: task-management-db
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
    driver: local
